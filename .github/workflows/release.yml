name: Release

# Keeps the "Release blueprint vX.Y.Z" PR up to date from conventional commits
# on main. Merging that PR tags vX.Y.Z and publishes a GitHub Release.
on:
  push:
    branches: [main]

concurrency: release-please

permissions:
  contents: write
  issues: write # release-please labels its PR autorelease: pending
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
