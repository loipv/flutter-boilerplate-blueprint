name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup (writes Firebase options stubs if missing)
        run: make setup
      - name: Analyze
        run: make analyze
      - name: Test
        run: make test
