# Blueprint-only: init removes this file from generated apps.
# Minor and patch updates are grouped into one PR per ecosystem and directory;
# majors arrive as separate PRs. chore(deps) commits do not trigger a release.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      functions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /firebase_tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      firebase-tests-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
