name: blueprint_app
description: "A Flutter + Firebase starter app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # --- Navigation ---
  go_router: ^17.2.0

  # --- Firebase ---
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_app_check: ^0.4.2
  # BEGIN_REMOTE_CONFIG
  firebase_remote_config: ^6.7.1
  # END_REMOTE_CONFIG

  # --- Auth providers ---
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7

  # --- Data / Models ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # --- UI ---
  flutter_svg: ^2.2.4
  gap: ^3.0.1
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^3.1.10
  auto_size_text: ^3.0.0
  wolt_modal_sheet: ^0.11.0
  flutter_slidable: ^4.0.3

  # --- Storage ---
  shared_preferences: ^2.5.5

  # --- Analytics & Monitoring ---
  # BEGIN_POSTHOG
  posthog_flutter: ^5.23.1
  # END_POSTHOG
  # BEGIN_SENTRY
  sentry_flutter: ^9.16.1
  # END_SENTRY
  package_info_plus: ^10.0.0

  # --- Utilities ---
  logging: ^1.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.5
  permission_handler: ^12.0.1

  # --- Notifications ---
  # BEGIN_NOTIFICATIONS
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  workmanager: ^0.9.0+3
  # END_NOTIFICATIONS

  # --- Icons ---
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.3
  build_runner: ^2.6.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  # BEGIN_SENTRY
  sentry_dart_plugin: ^3.2.1
  # END_SENTRY
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.4.0
  firebase_auth_mocks: ^0.15.2
  mock_exceptions: ^0.8.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#141D21"
  adaptive_icon_foreground: "assets/icons/app_logo.png"

flutter_native_splash:
  color: "#141D21"
  color_dark: "#141D21"
  image: "assets/icons/app_logo.png"
  image_dark: "assets/icons/app_logo.png"
  android_12:
    image: "assets/icons/app_logo.png"
    image_dark: "assets/icons/app_logo.png"
    icon_background_color: "#141D21"
    icon_background_color_dark: "#141D21"
    color: "#141D21"
    color_dark: "#141D21"
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
    - family: Inter_24pt
      fonts:
        - asset: assets/fonts/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_24pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter_24pt-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
